<!doctype html>
<html lang="en" style="background-color: #121212">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#121212" />
        <title>De Glitchy Alchemist</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="row">
            <div class="container" id="countdownContainer">
                Nog
                <span id="countdown"> <!-- Filled by JavaScript --> </span> seconden
                over
            </div>
            <div class="container">
                <span id="points"></span> punten
            </div>
        </div>

        <div class="container">
            <button id="collectIngredient">Verzamel Ingredi&euml;nt</button>
        </div>

        <div class="row">
            <div class="container" id="inventoryContainer">
                <h2>Inventaris</h2>
                <h3>Ingredi&euml;nten</h3>
                <ul id="ingredientInventory">
                    <!-- Filled by JavaScript -->
                </ul>
                <h3>Gemaakte items</h3>
                <ul id="craftedInventory">
                    <!-- Filled by JavaScript -->
                </ul>
            </div>

            <div class="container" id="craftingContainer">
                <h2>Crafting</h2>
                <table id="craftingTable">
                    <!-- Filled by JavaScript -->
                </table>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
        <script type="module" src="dist/script.js"></script>
    </body>
</html>
